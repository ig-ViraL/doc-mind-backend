name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: pip install fastapi pydantic-settings "sqlalchemy[asyncio]" asyncpg pgvector openai httpx numpy pytest pytest-asyncio
      - run: python -m pytest -q
